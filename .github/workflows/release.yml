name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check
        run: make vet fmt-check test

      - name: Extract ChangeLog entry ...
        run: |
          # A release needs its dated entry on top.  A pre-release, such as
          # v1.0.0-rc1, goes out with the upcoming v1.0.0 entry, dated or not.
          tag=$GITHUB_REF_NAME
          top=$(grep -m1 '^\[v' doc/ChangeLog.md)
          case "$tag" in
            *-*) want="[${tag%%-*}][" ;;
            *)   want="[$tag][] - " ;;
          esac
          case "$top" in
            "$want"*) ;;
            *) echo "::error::doc/ChangeLog.md starts with '$top', expected '${want}...' for $tag"
               exit 1 ;;
          esac
          .github/extract-changelog.sh < doc/ChangeLog.md > "$RUNNER_TEMP/release.md"
          cat "$RUNNER_TEMP/release.md"

      # Via the module proxy, not GitHub releases; goreleaser needs a newer Go.
      - name: Build and upload the release
        run: go run github.com/goreleaser/goreleaser/v2@v2.20.0 release --clean --config .github/goreleaser.yml --release-notes "$RUNNER_TEMP/release.md"
        env:
          GOTOOLCHAIN: auto
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
