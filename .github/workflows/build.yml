name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Run tests
        run: make test

      - name: Vet
        run: make vet

      - name: Format
        run: make fmt-check

      - name: Man page
        run: |
          sudo apt-get install -y --no-install-recommends mandoc
          make man-lint

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7
